apiVersion: v1
kind: Namespace
metadata:
  name: reverse-office
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: office-data
  namespace: reverse-office
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: office
  namespace: reverse-office
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reverse-office
  template:
    metadata:
      labels:
        app: reverse-office
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: office
          image: reverse-office:romania
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: APP_ORIGIN
              value: https://office.example.com
            - name: COOKIE_SECURE
              value: 'true'
            - name: TRUST_PROXY
              value: '1'
          envFrom:
            - secretRef:
                name: office-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 20
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: temp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: office-data
        - name: temp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: office
  namespace: reverse-office
spec:
  selector:
    app: reverse-office
  ports:
    - port: 80
      targetPort: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: office
  namespace: reverse-office
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 26m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [office.example.com]
      secretName: office-tls
  rules:
    - host: office.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: office
                port:
                  number: 80

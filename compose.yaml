services:
  office:
    build: .
    image: reverse-office:local
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SETUP_KEY: ${SETUP_KEY:?Set a long random SETUP_KEY in .env}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-qwen2.5:7b}
      AI_API_KEY: ${AI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      PDF_P12_PATH: ${PDF_P12_PATH:-}
      PDF_P12_PASSPHRASE: ${PDF_P12_PASSPHRASE:-}
      OFFICE_PUBLIC_URL: ${OFFICE_PUBLIC_URL:-}
      OFFICE_INTERNAL_URL: ${OFFICE_INTERNAL_URL:-http://documentserver}
      OFFICE_APP_URL: ${OFFICE_APP_URL:-http://office:3001}
      OFFICE_JWT_SECRET: ${OFFICE_JWT_SECRET:-}
    volumes:
      - office-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
  documentserver:
    image: onlyoffice/documentserver:10.0.0
    profiles: [editors]
    restart: unless-stopped
    ports:
      - '127.0.0.1:8082:80'
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${OFFICE_JWT_SECRET:?Set a random OFFICE_JWT_SECRET in .env}
      JWT_HEADER: AuthorizationJwt
      JWT_IN_BODY: 'true'
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
    volumes:
      - editors-data:/var/www/onlyoffice/Data
      - editors-logs:/var/log/onlyoffice
      - editors-db:/var/lib/postgresql
      - editors-cache:/var/lib/onlyoffice
    shm_size: 256m
    mem_limit: 4g
    cpus: 4
  ollama:
    image: ollama/ollama:0.11.4
    profiles: [ai]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
volumes:
  office-data:
  ollama-data:
  editors-data:
  editors-logs:
  editors-db:
  editors-cache:
